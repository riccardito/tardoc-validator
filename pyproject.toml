[project]
name = "tardoc-validator"
version = "0.1.0"
description = "Check an outpatient service list against TARDOC's tariff rules, and say what is wrong."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["openpyxl>=3.1", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
tardoc-validator = "tardoc_validator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tardoc_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tardoc_validator"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
